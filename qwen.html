<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#aee1ff">
<title>泡泡国学堂 · 听音找字</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/zcool-kuaile@latest/index.css">
<style>
:root{
  --ink:#2b3a55; --ink2:#5a6b88; --paper:#fffdf6;
  --coral:#ff6b5e; --amber:#ffb63d; --teal:#29c1b0; --blue:#4d9de0;
  --pink:#f27bae; --green:#7cb518; --orange:#ff8f3f; --gold:#ffce3a;
  --sky1:#9fd9ff; --sky2:#e9f8ff; --hill1:#8fd07e; --hill2:#62b857;
  --disp:'ZCOOL KuaiLe','Yuanti SC','YouYuan','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  --body:'Yuanti SC','YouYuan','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;overflow:hidden;position:fixed;width:100%;}
body{
  font-family:var(--body);color:var(--ink);user-select:none;-webkit-user-select:none;
  touch-action:manipulation;background:linear-gradient(180deg,var(--sky1),var(--sky2) 62%);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
.disp{font-family:var(--disp);}

/* ---------- SCENE ---------- */
.scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;}
.sun{position:absolute;top:4%;right:6%;width:clamp(70px,12vmin,120px);height:clamp(70px,12vmin,120px);}
.sun .rays{transform-origin:50% 50%;animation:spin 50s linear infinite;}
.cloud{position:absolute;background:#fff;border-radius:60px;opacity:.92;filter:drop-shadow(0 6px 10px rgba(70,120,160,.18));}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%;}
.cloud::before{width:55%;height:150%;left:12%;top:-55%;}
.cloud::after{width:42%;height:130%;right:14%;top:-40%;}
.c1{width:130px;height:38px;top:14%;animation:drift 46s linear infinite;}
.c2{width:90px;height:28px;top:30%;animation:drift 64s linear infinite;animation-delay:-22s;opacity:.8;}
.c3{width:160px;height:46px;top:8%;animation:drift 80s linear infinite;animation-delay:-50s;opacity:.7;}
.bird{position:absolute;top:22%;width:34px;height:14px;animation:fly 30s linear infinite;}
.bird.b2{top:34%;width:26px;animation-duration:42s;animation-delay:-12s;opacity:.7;}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:34vh;min-height:120px;}
.tw{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:tw 3s ease-in-out infinite;}

/* ---------- APP / SCREENS ---------- */
#app{position:relative;z-index:2;height:100dvh;width:100%;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;}
.screen.active{display:flex;animation:fadeIn .4s ease;}

/* ---------- START ---------- */
#scr-start{padding:14px clamp(12px,4vw,40px) 8px;}
.cornerSet{position:absolute;top:10px;right:14px;display:flex;gap:8px;z-index:5;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:3px solid var(--ink);
  border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;box-shadow:0 4px 0 rgba(43,58,85,.18);}
.chip.off{opacity:.45;filter:grayscale(.6);}
.chip .ic{font-size:16px;}
.startWrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,22px);position:relative;z-index:3;}
.mascotCol{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;}
.mascotBadge{width:clamp(120px,22vmin,180px);height:clamp(120px,22vmin,180px);border-radius:50%;overflow:hidden;
  border:4px solid var(--ink);box-shadow:0 8px 0 rgba(43,58,85,.18),0 14px 26px rgba(43,58,85,.25);background:#d8f3e5;
  animation:wob 4.5s ease-in-out infinite;position:relative;}
.mascotBadge img{width:100%;height:100%;object-fit:cover;display:block;}
.mascotBadge .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:64px;}
.speechBub{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:6px 14px;font-weight:700;font-size:14px;
  box-shadow:0 4px 0 rgba(43,58,85,.18);position:relative;animation:wob2 3.6s ease-in-out infinite;}
.speechBub::before{content:"";position:absolute;top:-9px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-bottom-color:var(--ink);}
.speechBub::after{content:"";position:absolute;top:-5px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-bottom-color:var(--paper);}
.titleCol{text-align:center;}
.logo{font-family:var(--disp);font-size:clamp(40px,9.5vw,78px);line-height:1;display:flex;gap:.04em;justify-content:center;flex-wrap:wrap;
  filter:drop-shadow(0 4px 0 rgba(43,58,85,.22));}
.logo span{display:inline-block;animation:tile 2.6s ease-in-out infinite;}
.subtitle{margin-top:8px;display:inline-block;background:var(--paper);border:3px solid var(--ink);border-radius:999px;
  padding:5px 16px;font-weight:700;font-size:clamp(12px,2.6vw,16px);box-shadow:0 4px 0 rgba(43,58,85,.18);}
.btnCol{display:flex;flex-direction:column;gap:12px;width:min(320px,82vw);}
.btn3d{font-family:var(--disp);font-size:clamp(18px,4.4vw,24px);color:#fff;border:3px solid var(--ink);border-radius:999px;
  padding:12px 18px;box-shadow:0 6px 0 var(--cd,#000),0 12px 20px rgba(43,58,85,.22);transition:transform .08s,box-shadow .08s;
  display:flex;align-items:center;justify-content:center;gap:10px;letter-spacing:1px;}
.btn3d:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cd,#000),0 6px 12px rgba(43,58,85,.22);}
.btn3d.coral{background:var(--coral);--cd:#d8463a;}
.btn3d.teal{background:var(--teal);--cd:#1c9385;}
.btn3d.amber{background:var(--amber);--cd:#d8931f;}
.btn3d.blue{background:var(--blue);--cd:#2f7cb8;}
.btn3d.small{font-size:16px;padding:9px 16px;}
.stepStrip{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;padding:6px 0 4px;z-index:3;}
.step{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.85);border:3px solid var(--ink);border-radius:999px;
  padding:5px 12px;font-weight:700;font-size:13px;box-shadow:0 3px 0 rgba(43,58,85,.16);}
.step .e{font-size:18px;}
.arr{font-size:18px;color:var(--ink2);font-weight:900;}
.deco{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--disp);
  opacity:.85;box-shadow:inset 0 -5px 10px rgba(0,0,0,.14),0 6px 14px rgba(43,58,85,.2);border:3px solid rgba(255,255,255,.7);
  pointer-events:none;z-index:1;animation:deco 9s ease-in-out infinite alternate;}

/* ---------- LEVELS ---------- */
#scr-levels{padding:10px clamp(10px,3vw,28px) 8px;}
.mapHead{display:flex;align-items:center;gap:10px;padding:2px 4px 8px;}
.iconBtn{width:46px;height:46px;border-radius:14px;background:var(--paper);border:3px solid var(--ink);font-size:20px;
  box-shadow:0 4px 0 rgba(43,58,85,.18);display:flex;align-items:center;justify-content:center;}
.iconBtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(43,58,85,.18);}
.mapHead h2{font-family:var(--disp);font-size:clamp(20px,5vw,30px);margin:0;flex:1;}
.mapWrap{flex:1;display:flex;flex-direction:column;justify-content:space-around;gap:4px;overflow:hidden;}
.mapRow{position:relative;}
.chBanner{display:inline-flex;align-items:center;gap:6px;color:#fff;font-family:var(--disp);font-size:clamp(13px,3vw,17px);
  border:3px solid var(--ink);border-radius:999px;padding:3px 14px;box-shadow:0 3px 0 rgba(43,58,85,.2);margin:0 0 2px 6px;}
.rowInner{position:relative;padding:4px 7% 2px;}
.rowPath{position:absolute;inset:0;width:100%;height:100%;}
.nodes{position:relative;display:flex;justify-content:space-between;align-items:flex-start;}
.nodeWrap{display:flex;flex-direction:column;align-items:center;gap:3px;width:23%;}
.node{width:clamp(48px,12vmin,68px);height:clamp(48px,12vmin,68px);border-radius:50%;border:3px solid var(--ink);
  font-family:var(--disp);font-size:clamp(20px,5vmin,28px);color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 5px 0 rgba(43,58,85,.25),0 8px 14px rgba(43,58,85,.2);position:relative;transition:transform .1s;}
.node:active{transform:translateY(3px);}
.node.locked{background:#cdd5e4!important;color:#8b94a7;box-shadow:0 5px 0 rgba(43,58,85,.18);}
.node.locked .lk{position:absolute;font-size:18px;}
.node.current{animation:nodePulse 1.6s ease-in-out infinite;}
.node .nm{position:relative;z-index:1;}
.stars{display:flex;gap:2px;}
.stars i{font-size:clamp(11px,2.6vmin,15px);color:#cdd5e4;line-height:1;}
.stars i.on{color:var(--gold);text-shadow:0 1px 0 #d8931f;}
.rowLink{text-align:center;color:var(--ink2);font-size:18px;animation:bobd 1.6s ease-in-out infinite;}

/* ---------- GAME ---------- */
#scr-game{padding:8px clamp(8px,2.4vw,20px) 8px;}
.gameCol{flex:1;display:flex;flex-direction:column;gap:8px;min-height:0;}
#hud{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.lvlChip{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:5px 12px;font-family:var(--disp);
  font-size:clamp(13px,3vw,17px);box-shadow:0 4px 0 rgba(43,58,85,.18);white-space:nowrap;}
.dots{display:flex;gap:5px;align-items:center;flex:1;justify-content:center;flex-wrap:wrap;}
.dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff;}
.dot.done{background:var(--gold);}
.dot.cur{animation:dotPulse 1s ease-in-out infinite;}
.missChip{background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:4px 10px;font-weight:700;font-size:13px;
  box-shadow:0 3px 0 rgba(43,58,85,.18);display:none;}
.missChip.show{display:inline-flex;gap:4px;align-items:center;}
#promptCard{display:flex;align-items:center;gap:12px;background:var(--paper);border:3px solid var(--ink);border-radius:22px;
  padding:8px 12px;box-shadow:0 6px 0 rgba(43,58,85,.18);transition:background .3s;}
#promptCard.reveal{background:#fff6d8;animation:revPop .4s ease;}
.speakBtn{width:clamp(48px,11vmin,60px);height:clamp(48px,11vmin,60px);border-radius:50%;background:var(--coral);border:3px solid var(--ink);
  font-size:clamp(22px,5vmin,28px);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #d8463a;position:relative;flex:0 0 auto;}
.speakBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #d8463a;}
.speakBtn.speaking::before,.speakBtn.speaking::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:3px solid var(--coral);animation:ring 1s ease-out infinite;}
.speakBtn.speaking::after{animation-delay:.5s;}
.pMid{flex:1;text-align:center;min-width:0;}
.pBig{font-family:var(--disp);font-size:clamp(22px,5.4vmin,36px);line-height:1.1;color:var(--ink);}
.pBig .q{color:var(--coral);}
.pBig .ra{color:var(--ink2);}
.pBig .ar{color:var(--coral);margin:0 .15em;}
.pBig .rb{color:var(--teal);}
.pSub{font-size:clamp(11px,2.6vmin,15px);color:var(--ink2);font-weight:700;margin-top:2px;}
.pSub .py{font-style:normal;letter-spacing:.5px;}
.hintBtn{width:clamp(42px,9.5vmin,52px);height:clamp(42px,9.5vmin,52px);border-radius:50%;background:var(--amber);border:3px solid var(--ink);
  font-size:clamp(20px,4.6vmin,26px);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 #d8931f;flex:0 0 auto;}
.hintBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #d8931f;}
#playArea{flex:1;position:relative;border-radius:24px;overflow:hidden;touch-action:none;
  background:radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%);}
#comboChip{position:absolute;top:8px;right:10px;background:var(--pink);color:#fff;font-family:var(--disp);border:3px solid var(--ink);
  border-radius:999px;padding:4px 12px;font-size:15px;box-shadow:0 4px 0 #c85389;opacity:0;transform:scale(.4);pointer-events:none;z-index:6;}
#comboChip.show{animation:comboPop .4s cubic-bezier(.34,1.56,.64,1) forwards;}

.bubble{position:absolute;left:0;top:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;
  font-family:var(--disp);background:radial-gradient(circle at 32% 27%,rgba(255,255,255,.6),rgba(255,255,255,0) 44%),var(--c);
  box-shadow:inset 0 -6px 12px rgba(0,0,0,.16),0 8px 16px rgba(43,58,85,.24);border:3px solid rgba(255,255,255,.8);
  touch-action:manipulation;cursor:pointer;will-change:transform;}
.btxt{line-height:1;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.2);animation:bob 3.4s ease-in-out infinite alternate;animation-delay:var(--d,0s);}
.bubble.spawn{animation:spawnIn .5s cubic-bezier(.34,1.56,.64,1) backwards;animation-delay:var(--sd,0s);}
.bubble.shake{animation:shk .45s;}
.bubble.burst{animation:burst .55s ease-out forwards;pointer-events:none;}
.bubble.burst::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:4px solid rgba(255,255,255,.85);animation:ringOut .5s ease-out;}
.bubble.shrink{animation:shrink .3s ease-in forwards;pointer-events:none;}

/* ---------- CLEAR ---------- */
#clearOverlay{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;
  background:rgba(43,58,85,.45);backdrop-filter:blur(2px);padding:16px;}
#clearOverlay.show{display:flex;animation:fadeIn .3s ease;}
.clearCard{background:var(--paper);border:4px solid var(--ink);border-radius:30px;padding:18px 22px 22px;text-align:center;
  width:min(420px,92vw);box-shadow:0 12px 0 rgba(43,58,85,.2),0 24px 40px rgba(0,0,0,.3);animation:cardIn .5s cubic-bezier(.34,1.56,.64,1);}
.cMascot{width:120px;height:120px;border-radius:50%;overflow:hidden;margin:0 auto;border:4px solid var(--ink);background:#fff3d6;position:relative;}
.cMascot img{width:100%;height:100%;object-fit:cover;}
.cMascot .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;}
.cTitle{font-family:var(--disp);font-size:clamp(28px,7vw,42px);margin:8px 0 2px;color:var(--coral);
  -webkit-text-stroke:1px rgba(43,58,85,.15);}
.cSub{font-weight:700;color:var(--ink2);font-size:14px;}
.cStars{display:flex;justify-content:center;gap:8px;margin:10px 0;}
.cStar{font-size:46px;color:#dfe4ee;line-height:1;transform:scale(0);}
.cStar.on{color:var(--gold);text-shadow:0 3px 0 #d8931f;animation:starPop .5s cubic-bezier(.34,1.56,.64,1) forwards;}
.cStats{font-weight:700;color:var(--ink2);font-size:13px;margin-bottom:14px;}
.cBtns{display:flex;flex-direction:column;gap:10px;}

/* ---------- MODAL ---------- */
#modalHelp{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(43,58,85,.5);padding:16px;}
#modalHelp.show{display:flex;}
.helpCard{background:var(--paper);border:4px solid var(--ink);border-radius:26px;padding:18px 20px;width:min(400px,92vw);
  box-shadow:0 12px 0 rgba(43,58,85,.2);animation:cardIn .4s cubic-bezier(.34,1.56,.64,1);}
.helpCard h3{font-family:var(--disp);font-size:26px;margin:0 0 12px;text-align:center;color:var(--teal);}
.helpRow{display:flex;align-items:center;gap:12px;margin:10px 0;}
.helpRow .he{font-size:34px;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:3px solid var(--ink);flex:0 0 auto;}
.helpRow p{margin:0;font-weight:700;font-size:14px;line-height:1.4;}
.helpNote{background:#fff6d8;border:2px dashed var(--amber);border-radius:14px;padding:8px 12px;font-size:12px;font-weight:700;color:#a06a10;margin:12px 0;}
.setRow{display:flex;align-items:center;gap:10px;margin:10px 0;}
.setLab{font-family:var(--disp);font-size:17px;color:var(--ink);min-width:76px;}
.segs{display:flex;gap:6px;flex:1;}
.seg{flex:1;font-family:var(--disp);font-size:15px;padding:6px 4px;border:3px solid var(--ink);border-radius:999px;
  background:#fff;box-shadow:0 3px 0 rgba(43,58,85,.16);transition:transform .08s,box-shadow .08s,background .2s;}
.seg:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(43,58,85,.16);}
.seg.on{background:var(--teal);color:#fff;box-shadow:0 3px 0 #1c9385;}
#btnEngineTag{font-size:11px;font-weight:900;}

/* ---------- TOAST / CONFETTI ---------- */
#toastLayer{position:fixed;inset:0;z-index:30;pointer-events:none;}
.toast{position:absolute;transform:translate(-50%,-50%);font-family:var(--disp);font-size:clamp(22px,6vw,34px);
  white-space:nowrap;text-shadow:0 3px 0 rgba(43,58,85,.25);animation:toastUp 1s ease-out forwards;}
.toast.good{color:#3fbf6b;}
.toast.bad{color:var(--orange);}
#confetti{position:fixed;inset:0;z-index:35;pointer-events:none;}

/* ---------- ANIMATIONS ---------- */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes fly{0%{transform:translateX(-10vw)}100%{transform:translateX(110vw)}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.2)}}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes wob2{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-4px) rotate(1deg)}}
@keyframes tile{0%,100%{transform:translateY(0) rotate(var(--rot,0deg))}50%{transform:translateY(-12%) rotate(calc(var(--rot,0deg)*-1))}}
@keyframes deco{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-26px) rotate(6deg)}}
@keyframes bob{from{transform:translateY(-3%) rotate(-2deg)}to{transform:translateY(3%) rotate(2deg)}}
@keyframes bobd{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@keyframes spawnIn{from{transform:var(--pos) scale(0)}to{transform:var(--pos) scale(1)}}
@keyframes shk{0%,100%{transform:var(--pos)}20%{transform:var(--pos) translateX(-7px) rotate(-4deg)}40%{transform:var(--pos) translateX(7px) rotate(4deg)}60%{transform:var(--pos) translateX(-5px) rotate(-3deg)}80%{transform:var(--pos) translateX(5px) rotate(3deg)}}
@keyframes burst{0%{transform:var(--pos) scale(1);opacity:1}40%{transform:var(--pos) scale(1.25);opacity:1}100%{transform:var(--pos) scale(1.95);opacity:0}}
@keyframes ringOut{from{opacity:.9;transform:scale(.7)}to{opacity:0;transform:scale(1.7)}}
@keyframes shrink{to{transform:var(--pos) scale(0);opacity:0}}
@keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@keyframes dotPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,107,94,.6)}50%{transform:scale(1.25);box-shadow:0 0 0 5px rgba(255,107,94,0)}}
@keyframes nodePulse{0%,100%{box-shadow:0 5px 0 rgba(43,58,85,.25),0 0 0 0 rgba(255,107,94,.6)}50%{box-shadow:0 5px 0 rgba(43,58,85,.25),0 0 0 8px rgba(255,107,94,0)}}
@keyframes comboPop{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes toastUp{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}40%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-130%) scale(1)}}
@keyframes starPop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1) rotate(0)}}
@keyframes cardIn{from{transform:scale(.7) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
@keyframes revPop{0%{transform:scale(.96)}50%{transform:scale(1.03)}100%{transform:scale(1)}}

/* ---------- RESPONSIVE ---------- */
@media (orientation:landscape) and (min-width:760px){
  .startWrap{flex-direction:row;gap:clamp(20px,4vw,60px);}
  .titleCol{order:2;flex:1;}
  .mascotCol{order:1;}
  .btnCol{order:3;width:min(280px,30vw);}
}
@media (max-height:560px){
  .mascotBadge{width:96px;height:96px;}
  .speechBub{display:none;}
  .logo{font-size:clamp(30px,7vh,52px);}
  .btn3d{padding:8px 14px;font-size:16px;}
  .stepStrip{display:none;}
  .deco{display:none;}
  #promptCard{padding:5px 10px;gap:8px;}

/* ==== VOICE ENGINE START ==== (extracted verbatim by tests/voice.test.js — keep self-contained) */
/* ============ VOICE (neural TTS, local fallback) ============
 * Primary engine: Google Translate's neural Chinese voice, streamed to the page as MP3 and
 * played through a plain <audio> element. It needs no API key, is free, and is dramatically
 * more accurate than the OS speech engine — many Android devices ship *no* zh voice at all,
 * so speechSynthesis happily reads 汉字 with an English voice. The endpoint sends no CORS
 * headers, which is fine: we never fetch() it, the media element loads it directly.
 * If the network engine is unreachable we demote to window.speechSynthesis and stay there.
 */
const Voice=(()=>{
  const SYNTH=window.speechSynthesis||null;
  const HOST='https://translate.google.com/translate_tts';
  // The endpoint quantises ttsspeed: anything >= 0.4 is ignored, <= 0.3 buys ~19% more air.
  const SPEED={slow:0.3,normal:1};
  const LOCAL_RATE={slow:0.62,normal:0.88};
  const CHUNK=90;          // chars per request (well under the endpoint's 200 cap)
  const LOAD_TIMEOUT=5000; // ms to wait for mp3 before demoting to the local engine
  const CACHE_MAX=240;     // LRU-ish cap so long sessions don't grow unbounded
  const PRE_MAX=3;         // concurrent prefetches (be nice to a free endpoint)
  const PRE_GAP=130;       // ms between prefetch starts
  const NET_GIVEUP=2;      // consecutive failures before auto mode stops trying the network
  // 1 frame of near-silence: unlocking the audio session inside a user gesture is required on
  // iOS Safari, and it must not make a network request to do it.
  const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgD4AAAB9AAACABAAZGF0YQAAAAA=';

  let engine='auto';            // 'auto' | 'neural' | 'local'
  let on=true;
  let speed='normal';
  let localVoice=null;
  let netFail=0;
  let epoch=0;                  // bumped on interrupt so stale items are dropped
  let queue=[];
  let playing=false;
  let primed=false;
  let preCount=0, preTimer=0;
  const cache=new Map();        // "speed|text" -> HTMLAudioElement
  const pending=new Map();      // "speed|text" -> {a,rej}
  const stats={neural:0,local:0,errors:0};

  function pickLocal(){ if(!SYNTH)return; const vs=SYNTH.getVoices()||[]; const zh=vs.filter(v=>/^zh/i.test(v.lang));
    localVoice=zh.find(v=>/CN|Hans|Tingting|Meijia|Sinji|Yaoyao/i.test(v.lang+v.name))||zh[0]
      ||vs.find(v=>/zh/i.test(v.lang))||null; }
  if(SYNTH){ try{ pickLocal(); SYNTH.onvoiceschanged=pickLocal; }catch(e){} }

  function key(text){ return speed+'|'+text; }

  function buildUrl(text){
    // Spaces and newlines are legal but the endpoint answers 400 on an empty q, so guard here.
    const clean=String(text).replace(/[\r\n]+/g,' ').trim();
    if(!clean)return '';
    return HOST+'?ie=UTF-8&client=tw-ob&tl=zh-CN&ttsspeed='+SPEED[speed]+'&q='+encodeURIComponent(clean);
  }

  // Split over-long text on punctuation so phrases keep their natural phrasing.
  function chunk(text){
    const s=String(text).trim(); if(!s)return [];
    if(s.length<=CHUNK)return [s];
    const PUNCT=/[，。！？、；：,.!?;:…—～]/;
    const out=[]; let rest=s;
    while(rest.length>CHUNK){
      // Break just after the last punctuation mark inside the window, so the
      // request stays short without slicing a sentence in half.
      let cut=-1;
      for(let i=CHUNK;i>0;i--){ if(PUNCT.test(rest.charAt(i-1))){ cut=i; break; } }
      if(cut<1)cut=CHUNK;
      out.push(rest.slice(0,cut));
      rest=rest.slice(cut);
    }
    if(rest.trim())out.push(rest.trim());
    return out.length?out:[s];
  }

  // Fetch (really: preload) one clip. Resolves with an <audio> ready to play.
  function load(text){
    const k=key(text);
    const hit=cache.get(k); if(hit){ cache.delete(k); cache.set(k,hit); return Promise.resolve(hit); }
    const inflight=pending.get(k); if(inflight)return inflight.p;
    const url=buildUrl(text);
    if(!url)return Promise.reject(new Error('empty'));
    let a;
    try{ a=new Audio(); }catch(e){ return Promise.reject(e); }
    a.preload='auto'; a.playsInline=true; a.src=url;
    const p=new Promise((res,rej)=>{
      const timer=setTimeout(()=>{ cleanup(); rej(new Error('timeout')); },LOAD_TIMEOUT);
      function cleanup(){ clearTimeout(timer); a.removeEventListener('canplaythrough',ok); a.removeEventListener('error',bad); }
      function ok(){ cleanup(); res(a); }
      function bad(){ cleanup(); rej(new Error('network')); }
      a.addEventListener('canplaythrough',ok); a.addEventListener('error',bad);
      try{ a.load(); }catch(e){ cleanup(); rej(e); }
    }).then(a=>{ pending.delete(k); cache.set(k,a); if(cache.size>CACHE_MAX)cache.delete(cache.keys().next().value); return a; },
           e=>{ pending.delete(k); throw e; });
    pending.set(k,{a,p});
    return p;
  }

  function neuralFail(e){
    stats.errors++; netFail++;
    if(typeof console!=='undefined'&&console.debug)console.debug('[Voice] neural unavailable, falling back to system voice',e);
  }

  function playNeural(item,parts){
    let i=0;
    const step=()=>{
      if(item.e!==epoch||!on)return done();
      if(i>=parts.length)return done();
      const part=parts[i++];
      load(part).then(a=>{
        if(item.e!==epoch||!on)return done();
        stats.neural++;
        a.currentTime=0;
        const p=a.play();
        const bail=()=>{ if(item.e===epoch){ try{a.pause();}catch(_){} } };
        const finish=()=>{ if(item.e!==epoch)return; try{a.pause();}catch(_){} step(); };
        a.onended=finish; a.onerror=finish;
        if(p&&p.catch) p.catch(err=>{ if(err&&err.name==='NotAllowedError'){ netFail=NET_GIVEUP; } bail(); done(); });
      }).catch(err=>{ // network engine down — never strand the child in silence
        neuralFail(err);
        if(localSpeak(item))return;
        done();
      });
    };
    // Always release the claim, even for a superseded item, or the queue deadlocks.
    const done=()=>{ playing=false; if(item.e!==epoch)return; item.onend&&item.onend(); pump(); };
    step();
  }

  function localSpeak(item){
    if(!SYNTH)return false;
    try{
      const parts=chunk(item.text); let i=0;
      const finish=()=>{ playing=false; if(item.e!==epoch)return; item.onend&&item.onend(); pump(); };
      const step=()=>{
        if(item.e!==epoch||!on)return finish();
        if(i>=parts.length)return finish();
        const u=new SpeechSynthesisUtterance(parts[i++]);
        if(localVoice)u.voice=localVoice;
        u.lang=localVoice?localVoice.lang:'zh-CN';
        u.rate=item.rate||LOCAL_RATE[speed]||LOCAL_RATE.normal;
        u.pitch=item.pitch||1.1; u.volume=1;
        u.onend=step; u.onerror=step;
        setTimeout(()=>{ if(item.e!==epoch)return finish();
          try{ if(SYNTH.paused)SYNTH.resume(); SYNTH.speak(u); }catch(e){ finish(); } },30);
      };
      stats.local++; step(); return true;
    }catch(e){ return false; }
  }

  function pump(){
    if(playing)return;
    while(queue.length){
      const item=queue.shift();
      if(item.e!==epoch||!on)continue;         // superseded while waiting its turn
      playing=true;                            // claim synchronously: a load is in flight
      const useNet=engine==='neural'||(engine==='auto'&&netFail<NET_GIVEUP);
      if(useNet)return playNeural(item,chunk(item.text));
      if(localSpeak(item))return;
      playing=false;                           // nothing on this device can speak it
      item.onend&&item.onend();
    }
  }

  function stop(){
    epoch++; queue=[]; playing=false;
    for(const k of cache.keys()){ const a=cache.get(k); try{ a.pause(); }catch(e){} }
    if(SYNTH){ try{ SYNTH.cancel(); }catch(e){} }
  }

  // Warm the cache for a level's vocabulary so the first tap is instant.
  // Speeds itself so a whole 60-word level never hammers the free endpoint at once.
  let preQueue=[];
  function prefetch(texts){
    const seen=new Set();
    (Array.isArray(texts)?texts:[texts]).forEach(t=>{ const s=String(t||'').trim(); if(!s||seen.has(key(s)))return;
      if(cache.has(key(s))||pending.has(key(s)))return; seen.add(key(s)); preQueue.push(s); });
    if(preQueue.length&&!preTimer)preTimer=setTimeout(preStep,PRE_GAP);
  }
  function preStep(){
    preTimer=0;
    while(preCount<PRE_MAX&&preQueue.length){
      const t=preQueue.shift();
      preCount++;
      load(t).catch(()=>{}).then(()=>{ preCount=Math.max(0,preCount-1); if(preQueue.length&&!preTimer)preTimer=setTimeout(preStep,PRE_GAP); });
    }
  }

  function prime(){ // must be called synchronously from a user gesture
    if(primed)return; primed=true;
    try{ const a=new Audio(SILENT); a.volume=0.01; const p=a.play(); if(p&&p.catch)p.catch(()=>{}); }catch(e){}
    if(SYNTH){ try{ SYNTH.cancel(); const u=new SpeechSynthesisUtterance(''); u.lang='zh-CN'; SYNTH.speak(u); }catch(e){} }
  }

  return {
    speak(text,opt={}){
      const s=String(text||'').trim();
      if(!s)return;
      if(!on){ opt.onend&&opt.onend(); return; }
      if(opt.interrupt!==false)stop();
      queue.push({text:s,onend:opt.onend,rate:opt.rate,pitch:opt.pitch,e:epoch});
      pump();
    },
    prefetch, prime, stop,
    setOn(v){ if(on===v)return; on=v; if(!v)stop(); },
    get on(){ return on; },
    setEngine(v){ if(v!=='auto'&&v!=='neural'&&v!=='local')return; engine=v; netFail=0; },
    get engine(){ return engine; },
    // 'auto' reports which engine actually carried the last utterance.
    get activeEngine(){ return stats.neural>=stats.local?'neural':'local'; },
    setSpeed(v){ if(v!=='slow'&&v!=='normal')return; speed=v; },
    get speed(){ return speed; },
    get stats(){ return Object.assign({},stats,{cached:cache.size,queued:queue.length}); },
    _internals:{ buildUrl, chunk, key, load, SPEED, CHUNK, CACHE_MAX, LOAD_TIMEOUT }
  };
})();
/* ==== VOICE ENGINE END ==== */

const Store=(()=>{

/* ============ CONFETTI ============ */
const Confetti=(()=>{
  const cv=$('#confetti'),c=cv.getContext('2d'); let parts=[],raf=0,dpr=1;
  function size(){ dpr=Math.min(2,window.devicePixelRatio||1); cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px'; c.setTransform(dpr,0,0,dpr,0,0); }
  size(); addEventListener('resize',size);
  function burst(x,y,n,spread){ for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2,sp=(spread||6)*(0.4+Math.random());
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,g:.18+Math.random()*.1,rot:Math.random()*6,vr:(Math.random()-.5)*.4,
      c:PAL[(Math.random()*PAL.length)|0],s:5+Math.random()*6,life:1,dec:.012+Math.random()*.012,sh:Math.random()<.5?0:1}); }
    if(!raf)loop(); }
  function loop(){ c.clearRect(0,0,innerWidth,innerHeight);
    for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life-=p.dec;
      if(p.life<=0||p.y>innerHeight+30){parts.splice(i,1);continue;}
      c.save();c.globalAlpha=Math.max(0,p.life);c.translate(p.x,p.y);c.rotate(p.rot);c.fillStyle=p.c;
      if(p.sh)c.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); else{c.beginPath();c.arc(0,0,p.s/2,0,7);c.fill();} c.restore(); }
    if(parts.length)raf=requestAnimationFrame(loop); else{raf=0;c.clearRect(0,0,innerWidth,innerHeight);} }
  return {burst};
})();

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
function pick(a){ return a[(Math.random()*a.length)|0]; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

// Warm the network TTS cache for a level's whole vocabulary while the child reads the intro.
function prefetchLevel(cfg){
  if(!cfg)return;
  const items=cfg.type==='phrase'?cfg.pool.map(p=>p[0]).concat(cfg.pool.map(p=>p[1]))
    :(typeof cfg.pool[0]==='string'?cfg.pool:[]);
  if(!items.length)return;
  if(Voice.engine==='local')return;
  const warm=()=>Voice.prefetch(items);
  if(window.requestIdleCallback)requestIdleCallback(warm,{timeout:2500}); else setTimeout(warm,400);
}

/* ============ GAME ENGINE ============ */
let G=null; // game state
function startLevel(id){
  const cfg=LEVELS.find(L=>L.id===id);
  G={cfg,round:0,found:0,need:cfg.correct,mistakes:0,streak:0,maxStreak:0,start:Date.now(),
    bubbles:[],raf:0,sid:(G?G.sid+1:1),lock:true,prev:null,rt:null,W:0,H:0};
  show('scr-game');
  $('#lvlChip').textContent='第'+id+'关 · '+cfg.name;
  $('#missChip').classList.remove('show'); $('#missN').textContent='0';
  $('#clearOverlay').classList.remove('show');
  $('#comboChip').classList.remove('show');
  buildDots();
  $('#playArea').innerHTML='<div id="comboChip"></div>';
  measure();
  nextRound();
  prefetchLevel(cfg);
  if(!G.raf)loop(performance.now());
}
function buildDots(){ const w=$('#dotsWrap'); w.innerHTML=''; for(let i=0;i<G.cfg.rounds;i++){ const d=document.createElement('span'); d.className='dot'; w.appendChild(d); } }
function updateDots(){ const ds=$$('#dotsWrap .dot'); ds.forEach((d,i)=>{ d.classList.toggle('done',i<G.round-1); d.classList.toggle('cur',i===G.round-1); }); }
function measure(){ const r=$('#playArea').getBoundingClientRect(); G.W=r.width; G.H=r.height; }

function makeTexts(){
  const cfg=G.cfg;
  if(cfg.type==='phrase'){
    let pool=shuffle(cfg.pool).filter(p=>p!==G.prev); if(!pool.length)pool=shuffle(cfg.pool);
    const target=pool[0]; G.prev=target; G.rt={type:'phrase',a:target[0],apy:target[1],b:target[2],bpy:target[3]};
    const others=shuffle(cfg.pool.filter(p=>p!==target)).map(p=>p[2]);
    const distractors=others.slice(0,cfg.bubbles-cfg.correct);
    const texts=[...Array(cfg.correct).fill(target[2]),...distractors];
    return {texts,targetText:target[2]};
  } else {
    let pool=shuffle(cfg.pool).filter(t=>t!==G.prev); if(!pool.length)pool=shuffle(cfg.pool);
    const target=pool[0]; G.prev=target; G.rt={type:cfg.type,text:target,py:pyOf(cfg.type,target)};
    let distractorPool=shuffle(cfg.pool.filter(t=>t!==target));
    const need=cfg.bubbles-cfg.correct; let distractors=distractorPool.slice(0,need);
    if(cfg.conf && Math.random()<cfg.conf){
      const set=CONF.find(s=>s.includes(target));
      if(set){ const c=pick(set.filter(x=>x!==target));
        if(c && !distractors.includes(c)){ if(distractors.length>=need)distractors[distractors.length-1]=c; else distractors.push(c); } }
    }
    distractors=distractors.slice(0,need);
    const texts=[...Array(cfg.correct).fill(target),...distractors];
    return {texts,targetText:target};
  }
}

function radiusFor(len){
  const minDim=Math.min(G.W,G.H), area=G.W*G.H, count=G.cfg.bubbles;
  const maxR=0.5*Math.sqrt(area/(count*2.1));
  let r1=clamp(minDim*0.085,28,60);
  let r=r1*[1,1.16,1.3][Math.min(2,len-1)];
  r=Math.min(r,maxR); r=Math.max(r,22);
  const fs=len===1?r*0.92:len===2?r*0.6:Math.max(13,r*0.5);
  return {r,fs};
}

function nextRound(){
  G.round++; G.found=0; G.lock=true;
  updateDots();
  // clear old
  G.bubbles.forEach(b=>{ if(b.el&&b.el.parentNode){ b.el.classList.add('shrink'); setTimeout(()=>b.el.remove(),300); } });
  G.bubbles=[];
  const {texts,targetText}=makeTexts();
  const sh=shuffle(texts.map((t,i)=>({t,i})));
  const placed=[];
  sh.forEach((item,idx)=>{
    const len=item.t.length; const {r,fs}=radiusFor(len);
    let x,y,ok=false;
    for(let k=0;k<70;k++){ x=r+Math.random()*(G.W-2*r); y=r+Math.random()*(G.H-2*r);
      ok=placed.every(p=>Math.hypot(p.x-x,p.y-y)>p.r+r+8); if(ok)break; }
    if(!ok){ x=r+Math.random()*(G.W-2*r); y=r+Math.random()*(G.H-2*r); }
    placed.push({x,y,r});
    const ang=Math.random()*Math.PI*2; const base=clamp(Math.min(G.W,G.H)*0.05,20,42); const sp=base*(0.7+Math.random()*0.6);
    const b={x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,r,fs,text:item.t,isTarget:item.t===targetText,found:false,dead:false,
      color:PAL[(item.i+idx)%PAL.length],d:(Math.random()*2).toFixed(2)};
    const el=document.createElement('button'); el.className='bubble spawn'; el.style.setProperty('--c',b.color);
    el.style.width=el.style.height=(2*r)+'px'; el.style.setProperty('--sd',(idx*0.04)+'s');
    el.style.setProperty('--pos','translate3d('+(x-r)+'px,'+(y-r)+'px,0)');
    el.style.transform='translate3d('+(x-r)+'px,'+(y-r)+'px,0)';
    const tx=document.createElement('span'); tx.className='btxt'; tx.textContent=item.t; tx.style.fontSize=fs+'px'; tx.style.setProperty('--d',b.d+'s');
    if(len>=3)tx.style.letterSpacing='-1px';
    el.appendChild(tx); el._b=b; b.el=el; $('#playArea').appendChild(el);
    G.bubbles.push(b);
  });
  cardListen();
  const sid=G.sid;
  setTimeout(()=>{ if(!G||G.sid!==sid)return; G.lock=false; speakTarget(); },650);
}

function speakTarget(){
  const rt=G.rt; const txt=rt.type==='phrase'?rt.a:rt.text;
  setSpeaking(true); Voice.speak(txt,{onend:()=>setSpeaking(false)});
  if(!Voice.on)setTimeout(()=>setSpeaking(false),900);
}
function setSpeaking(v){ $('#btnSpeak').classList.toggle('speaking',v); }

function cardListen(){
  const card=$('#promptCard'); card.classList.remove('reveal');
  const rt=G.rt;
  if(rt.type==='phrase'){ $('#pBig').innerHTML=rt.a+'<span class="q">，？</span>'; $('#pSub').textContent='听一听，下一句是什么？'; }
  else { $('#pBig').textContent='听一听，找一找'; $('#pSub').textContent='找到读这个音的泡泡'; }
}
function cardReveal(){
  const card=$('#promptCard'); card.classList.add('reveal');
  const rt=G.rt;
  if(rt.type==='phrase'){ $('#pBig').innerHTML='<span class="ra">'+rt.a+'</span><span class="ar">➜</span><span class="rb">'+rt.b+'</span>';
    $('#pSub').innerHTML='<span class="py">'+rt.apy+' → '+rt.bpy+'</span>'; }
  else { $('#pBig').textContent=rt.text; $('#pSub').innerHTML='<span class="py">'+rt.py+'</span>'; }
}

$('#btnSpeak').onclick=()=>{ if(!G)return; SFX.click(); speakTarget(); };
$('#btnHint').onclick=()=>{ if(!G)return; SFX.click(); const rt=G.rt;
  if(rt.type==='phrase'){ setSpeaking(true); Voice.speak(rt.a+'，'+rt.b,{onend:()=>setSpeaking(false)});
    $('#pSub').innerHTML='<span class="py">提示：'+rt.bpy+'</span>'; }
  else { setSpeaking(true); Voice.speak(rt.text,{onend:()=>setSpeaking(false)});
    $('#pSub').innerHTML='<span class="py">提示：'+rt.py+'</span>'; }
  if(!Voice.on)setTimeout(()=>setSpeaking(false),900);
};

function tapBubble(b,clientX,clientY){
  if(G.lock||b.dead)return;
  SFX.tap(); b.vy-=26; b.vx+=(Math.random()-.5)*20;
  Voice.speak(b.text,{interrupt:true});
  if(b.isTarget&&!b.found){
    b.found=true; b.dead=true; G.found++; G.streak++; G.maxStreak=Math.max(G.maxStreak,G.streak);
    vib(20); SFX.ding();
    const rc=b.el.getBoundingClientRect();
    toast(clientX,clientY-10,pick(PRAISE),'good');
    Confetti.burst(rc.left+rc.width/2,rc.top+rc.height/2,14,5);
    b.el.classList.add('burst'); G.bubbles=G.bubbles.filter(x=>x!==b);
    showCombo();
    if(G.found>=G.need)roundWin();
  } else if(!b.isTarget){
    G.mistakes++; G.streak=0; hideCombo();
    vib([60]); SFX.buzz();
    toast(clientX,clientY-10,'✗ '+pick(ENCO),'bad');
    b.el.classList.remove('shake'); void b.el.offsetWidth; b.el.classList.add('shake');
    setTimeout(()=>b.el&&b.el.classList.remove('shake'),500);
    const mc=$('#missChip'); mc.classList.add('show'); $('#missN').textContent=G.mistakes;
  }
}
function showCombo(){ if(G.streak>=2){ const c=$('#comboChip'); c.textContent='连对 ×'+G.streak+' ⭐'; c.classList.remove('show'); void c.offsetWidth; c.classList.add('show'); } }
function hideCombo(){ $('#comboChip').classList.remove('show'); }

$('#playArea').addEventListener('pointerup',e=>{
  const el=e.target.closest&&e.target.closest('.bubble'); if(!el||!el._b)return;
  tapBubble(el._b,e.clientX,e.clientY);
});

function roundWin(){
  G.lock=true; cardReveal(); SFX.sparkle();
  const pr=pick(['真棒','太厉害了','好样的','答对啦','你真聪明','小明星']);
  Voice.speak(pr,{interrupt:false});
  const sid=G.sid;
  setTimeout(()=>{ if(!G||G.sid!==sid)return;
    if(G.round<G.cfg.rounds)nextRound(); else levelClear(); },1700);
}

function levelClear(){
  cancelAnimationFrame(G.raf); G.raf=0;
  const secs=Math.max(1,Math.round((Date.now()-G.start)/1000));
  const stars=G.mistakes===0?3:G.mistakes<=2?2:1;
  Store.setStar(G.cfg.id,stars);
  const ov=$('#clearOverlay');
  const last=G.cfg.id===LEVELS.length;
  $('#cTitle').textContent=last?'全部通关！🎉':'过关啦！';
  $('#cSub').textContent=last?'你是国学小状元！':pick(['你是识字小明星','继续加油哦','太了不起啦']);
  const cs=$('#cStars'); cs.innerHTML='';
  for(let i=0;i<3;i++){ const s=document.createElement('span'); s.className='cStar'; s.textContent='★';
    if(i<stars){ s.classList.add('on'); s.style.animationDelay=(0.3+i*0.35)+'s'; } cs.appendChild(s); }
  $('#cStats').textContent='用时 '+secs+' 秒 · 失误 '+G.mistakes+' 次 · 最高连对 '+G.maxStreak;
  $('#btnNext').style.display=last?'none':'flex';
  ov.classList.add('show');
  SFX.fanfare();
  setTimeout(()=>{ Confetti.burst(innerWidth*0.3,innerHeight*0.4,40,8); Confetti.burst(innerWidth*0.7,innerHeight*0.4,40,8); },150);
  setTimeout(()=>{ [0,1,2].forEach(i=>{ if(i<stars)setTimeout(()=>SFX.sparkle(),300+i*350); }); },300);
  renderMap();
}
$('#btnNext').onclick=()=>{ const nid=G.cfg.id+1; if(LEVELS.find(L=>L.id===nid))startLevel(nid); else{show('scr-levels');} };
$('#btnReplay').onclick=()=>startLevel(G.cfg.id);
$('#btnMap2').onclick=()=>{ cancelAnimationFrame(G&&G.raf); show('scr-levels'); renderMap(); };
$('#btnHome').onclick=()=>{ if(G){G.sid++;cancelAnimationFrame(G.raf);G.raf=0;} show('scr-levels'); renderMap(); };

/* ============ PHYSICS ============ */
function loop(ts){
  if(!G){return;}
  if(!G._last)G._last=ts;
  let dt=(ts-G._last)/1000; G._last=ts; dt=Math.min(dt,0.033);
  step(dt); render();
  G.raf=requestAnimationFrame(loop);
}
function step(dt){
  const bs=G.bubbles, W=G.W, H=G.H;
  const minDim=Math.min(W,H); const base=clamp(minDim*0.05,20,42); const minS=base*0.5, maxS=base*1.7;
  for(const b of bs){
    b.x+=b.vx*dt; b.y+=b.vy*dt;
    if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx)*0.96;} if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx)*0.96;}
    if(b.y-b.r<0){b.y=b.r;b.vy=Math.abs(b.vy)*0.96;} if(b.y+b.r>H){b.y=H-b.r;b.vy=-Math.abs(b.vy)*0.96;}
    b.vx+=(Math.random()-0.5)*16*dt; b.vy+=(Math.random()-0.5)*16*dt;
    let sp=Math.hypot(b.vx,b.vy);
    if(sp<minS){ if(sp<0.01){const a=Math.random()*7;b.vx=Math.cos(a)*minS;b.vy=Math.sin(a)*minS;} else{b.vx*=minS/sp;b.vy*=minS/sp;} }
    else if(sp>maxS){ b.vx*=maxS/sp;b.vy*=maxS/sp; }
  }
  for(let i=0;i<bs.length;i++)for(let j=i+1;j<bs.length;j++){
    const a=bs[i],c=bs[j]; let dx=c.x-a.x,dy=c.y-a.y; let d2=dx*dx+dy*dy; const rr=a.r+c.r;
    if(d2<rr*rr){ let d=Math.sqrt(d2)||0.01; if(d<0.001){dx=Math.random()-.5;dy=Math.random()-.5;d=0.5;}
      const nx=dx/d,ny=dy/d,overlap=rr-d; const im1=1/(a.r*a.r),im2=1/(c.r*c.r),ims=im1+im2;
      const corr=overlap*0.85; a.x-=nx*corr*(im1/ims); a.y-=ny*corr*(im1/ims); c.x+=nx*corr*(im2/ims); c.y+=ny*corr*(im2/ims);
      const rvx=c.vx-a.vx,rvy=c.vy-a.vy,rvn=rvx*nx+rvy*ny;
      if(rvn<0){ const e=0.92, jimp=-(1+e)*rvn/ims; a.vx-=jimp*im1*nx; a.vy-=jimp*im1*ny; c.vx+=jimp*im2*nx; c.vy+=jimp*im2*ny; }
    }
  }
}
function render(){ for(const b of G.bubbles){ if(b.dead)continue; b.el.style.transform='translate3d('+(b.x-b.r)+'px,'+(b.y-b.r)+'px,0)'; b.el.style.setProperty('--pos','translate3d('+(b.x-b.r)+'px,'+(b.y-b.r)+'px,0)'); } }

/* ============ NAV ============ */
$('#btnStart').onclick=()=>{ SFX.ensure(); SFX.click(); Voice.prime(); Voice.speak('开始啦'); startLevel(continueId()); };
$('#btnLevels').onclick=()=>{ SFX.click(); show('scr-levels'); renderMap(); };
$('#btnBackMap').onclick=()=>{ SFX.click(); show('scr-start'); };

/* ============ RESIZE ============ */
let rT; addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if(G&&$('#scr-game').classList.contains('active')){ measure();
  for(const b of G.bubbles){ b.x=clamp(b.x,b.r,G.W-b.r); b.y=clamp(b.y,b.r,G.H-b.r); } } },150); });
addEventListener('orientationchange',()=>{ setTimeout(()=>{ if(G&&$('#scr-game').classList.contains('active')){ measure(); for(const b of G.bubbles){ b.x=clamp(b.x,b.r,G.W-b.r); b.y=clamp(b.y,b.r,G.H-b.r);} } },300); });

/* ============ GLOBAL GUARDS ============ */
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
let firstGesture=false;
document.addEventListener('pointerdown',function once(){ if(firstGesture)return; firstGesture=true; SFX.ensure(); SFX.resume();
  Voice.prime(); },{once:false});
document.addEventListener('visibilitychange',()=>{ if(document.hidden)Voice.stop(); });

/* ============ INIT ============ */
syncToggles();
renderMap();
</script>
</body>
