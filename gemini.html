class Particle {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 8 + 4;
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8 + 2;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.color = ['#f43f5e', '#10b981', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899'][Math.floor(Math.random() * 6)];
        this.alpha = 1;
        this.decay = Math.random() * 0.02 + 0.015;
        this.shape = Math.random() > 0.5 ? 'circle' : 'star';
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.15;
        this.alpha -= this.decay;
    }

    draw(ctx) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.fillStyle = this.color;
        ctx.beginPath();
        if (this.shape === 'circle') {
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        } else {
            ctx.rect(this.x - this.size / 2, this.y - this.size / 2, this.size, this.size);
        }
        ctx.fill();
        ctx.restore();
    }
}

// 增强移动端音频与 SpeechSynthesis 解锁支持
class AudioController {
    constructor() {
        this.synth = window.speechSynthesis;
        this.voice = null;
        this.unlocked = false;
        this.initVoice();
    }

    initVoice() {
        if ('speechSynthesis' in window) {
            let loadVoices = () => {
                let voices = this.synth.getVoices();
                this.voice = voices.find(v => v.lang.includes('zh') || v.lang.includes('CN')) || voices[0];
            };
            loadVoices();
            if (this.synth.onvoiceschanged !== undefined) {
                this.synth.onvoiceschanged = loadVoices;
            }
        }
    }

    // 激活/解锁 iOS & Android Web Audio 及 Speech 权限
    unlockAudio() {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === 'suspended') {
                ctx.resume();
            }
            if (this.synth) {
                this.synth.cancel();
                // 播放一段静音字符促使 iOS 激活语音接口
                const dummy = new SpeechSynthesisUtterance('');
                dummy.lang = 'zh-CN';
                this.synth.speak(dummy);
            }
            this.unlocked = true;
        } catch (e) {
            console.log("Audio unlock failed", e);
        }
    }

    speak(text, speed = 0.85, onEndCallback = null) {
        if (!this.synth) return;
        
        // 避免 iOS 上语音队列卡死
        this.synth.cancel();
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.rate = speed;
        utterance.pitch = 1.15;
        
        if (!this.voice) {
            this.initVoice();
        }
        if (this.voice) {
            utterance.voice = this.voice;
        }
        utterance.lang = 'zh-CN';
        
        if (onEndCallback) {
            utterance.onend = onEndCallback;
        }

        // iOS Safari 兼容延迟处理
        setTimeout(() => {
            this.synth.speak(utterance);
        }, 50);
    }

    playSFX(type) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            if (ctx.state === 'suspended') {
                ctx.resume();
            }

            if (type === 'correct') {
                const freqs = [523.25, 659.25, 783.99, 1046.50];
                freqs.forEach((f, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, ctx.currentTime + idx * 0.08);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.08 + 0.3);
                    osc.start(ctx.currentTime + idx * 0.08);
                    osc.stop(ctx.currentTime + idx * 0.08 + 0.3);
                });
            } else if (type === 'cheer') {
                const notes = [400, 600, 800, 1200];
                notes.forEach((f, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, ctx.currentTime + i * 0.06);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime + i * 0.06);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.06 + 0.2);
                    osc.start(ctx.currentTime + i * 0.06);
                    osc.stop(ctx.currentTime + i * 0.06 + 0.2);
                });
            } else if (type === 'wrong') {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.25, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.2);
            } else if (type === 'levelUp') {
                const freqs = [523.25, 659.25, 783.99, 1046.50, 1318.51];
                freqs.forEach((f, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, ctx.currentTime + idx * 0.1);
                    gain.gain.setValueAtTime(0.3, ctx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.1 + 0.4);
                    osc.start(ctx.currentTime + idx * 0.1);
                    osc.stop(ctx.currentTime + idx * 0.1 + 0.4);
                });
            }
        } catch (e) {
            console.log("Audio disabled");
        }
    }
}

class Bubble {
    constructor(x, y, radius, text, isTarget, colorScheme, speedMultiplier, animalType) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.text = text;
        this.isTarget = isTarget;
        this.colorScheme = colorScheme;
        this.animalType = animalType;

        const angle = Math.random() * Math.PI * 2;
        const speed = (0.8 + Math.random() * 0.6) * speedMultiplier;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        
        this.mass = radius;
        this.scale = 1;
        this.targetScale = 1;
        this.smileTimer = 0;
    }

    update(width, height) {
        this.scale += (this.targetScale - this.scale) * 0.1;
        if (this.smileTimer > 0) {
            this.smileTimer--;
        }

        this.x += this.vx;
        this.y += this.vy;

        if (this.x - this.radius < 0) {
            this.x = this.radius;
            this.vx *= -1;
        } else if (this.x + this.radius > width) {
            this.x = width - this.radius;
            this.vx *= -1;
        }

        if (this.y - this.radius < 0) {
            this.y = this.radius;
            this.vy *= -1;
        } else if (this.y + this.radius > height) {
            this.y = height - this.radius;
            this.vy *= -1;
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.scale(this.scale, this.scale);

        if (gameSettings.avatar === 'animal') {
            this.drawAnimal(ctx);
        } else {
            this.drawBubble(ctx);
        }

        ctx.shadowBlur = 0;
        ctx.fillStyle = (gameSettings.avatar === 'animal' && this.animalType === 'panda') ? '#0f172a' : this.colorScheme.textColor;
        
        let fontSize = this.radius * 0.6;
        if (this.text.length === 2) fontSize = this.radius * 0.48;
        if (this.text.length >= 3) fontSize = this.radius * 0.38;

        ctx.font = `bold ${fontSize}px "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        
        const offsetY = (gameSettings.avatar === 'animal') ? this.radius * 0.12 : 2;
        ctx.fillText(this.text, 0, offsetY);

        ctx.restore();
    }

    drawBubble(ctx) {
        const gradient = ctx.createRadialGradient(
            -this.radius * 0.3, -this.radius * 0.3, this.radius * 0.1,
            0, 0, this.radius
        );
        gradient.addColorStop(0, '#ffffff');
        gradient.addColorStop(0.3, this.colorScheme.bgLight);
        gradient.addColorStop(1, this.colorScheme.bgDark);

        ctx.beginPath();
        ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.12)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 3;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(-this.radius * 0.3, -this.radius * 0.3, this.radius * 0.25, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.fill();
    }

    drawAnimal(ctx) {
        const r = this.radius;
        const isSmiling = this.smileTimer > 0;

        ctx.fillStyle = this.colorScheme.bgDark;
        if (this.animalType === 'rabbit') {
            ctx.beginPath();
            ctx.ellipse(-r * 0.35, -r * 0.9, r * 0.22, r * 0.5, -0.1, 0, Math.PI * 2);
            ctx.ellipse(r * 0.35, -r * 0.9, r * 0.22, r * 0.5, 0.1, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fbcfe8';
            ctx.beginPath();
            ctx.ellipse(-r * 0.35, -r * 0.9, r * 0.12, r * 0.35, -0.1, 0, Math.PI * 2);
            ctx.ellipse(r * 0.35, -r * 0.9, r * 0.12, r * 0.35, 0.1, 0, Math.PI * 2);
            ctx.fill();
        } else if (this.animalType === 'bear' || this.animalType === 'panda') {
            const earColor = (this.animalType === 'panda') ? '#1e293b' : this.colorScheme.bgDark;
            ctx.fillStyle = earColor;
            ctx.beginPath();
            ctx.arc(-r * 0.7, -r * 0.6, r * 0.3, 0, Math.PI * 2);
            ctx.arc(r * 0.7, -r * 0.6, r * 0.3, 0, Math.PI * 2);
            ctx.fill();
        } else if (this.animalType === 'cat') {
            ctx.beginPath();
            ctx.moveTo(-r * 0.8, -r * 0.2);
            ctx.lineTo(-r * 0.6, -r * 1.05);
            ctx.lineTo(-r * 0.15, -r * 0.75);
            ctx.moveTo(r * 0.8, -r * 0.2);
            ctx.lineTo(r * 0.6, -r * 1.05);
            ctx.lineTo(r * 0.15, -r * 0.75);
            ctx.fill();
        } else if (this.animalType === 'frog') {
            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.arc(-r * 0.5, -r * 0.75, r * 0.32, 0, Math.PI * 2);
            ctx.arc(r * 0.5, -r * 0.75, r * 0.32, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(-r * 0.5, -r * 0.75, r * 0.2, 0, Math.PI * 2);
            ctx.arc(r * 0.5, -r * 0.75, r * 0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(-r * 0.5, -r * 0.75, r * 0.1, 0, Math.PI * 2);
            ctx.arc(r * 0.5, -r * 0.75, r * 0.1, 0, Math.PI * 2);
            ctx.fill();
        }

        const bodyColor = (this.animalType === 'panda') ? '#ffffff' : ((this.animalType === 'frog') ? '#4ade80' : this.colorScheme.bgLight);
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fillStyle = bodyColor;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.12)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 3;
        ctx.fill();

        if (this.animalType === 'panda') {
            ctx.fillStyle = '#1e293b';
            ctx.beginPath();
            ctx.ellipse(-r * 0.4, -r * 0.25, r * 0.22, r * 0.16, -0.2, 0, Math.PI * 2);
            ctx.ellipse(r * 0.4, -r * 0.25, r * 0.22, r * 0.16, 0.2, 0, Math.PI * 2);
            ctx.fill();
        }

        ctx.fillStyle = 'rgba(244, 114, 182, 0.5)';
        ctx.beginPath();
        ctx.arc(-r * 0.55, -r * 0.05, r * 0.16, 0, Math.PI * 2);
        ctx.arc(r * 0.55, -r * 0.05, r * 0.16, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#1e293b';
        ctx.fillStyle = '#1e293b';
        ctx.lineWidth = 2.5;

        if (this.animalType !== 'frog') {
            if (isSmiling) {
                ctx.beginPath();
                ctx.arc(-r * 0.35, -r * 0.28, r * 0.12, Math.PI, 0);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(r * 0.35, -r * 0.28, r * 0.12, Math.PI, 0);
                ctx.stroke();
            } else {
                const eyeColor = (this.animalType === 'panda') ? '#ffffff' : '#1e293b';
                ctx.fillStyle = eyeColor;
                ctx.beginPath();
                ctx.arc(-r * 0.35, -r * 0.28, r * 0.09, 0, Math.PI * 2);
                ctx.arc(r * 0.35, -r * 0.28, r * 0.09, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        ctx.beginPath();
        if (isSmiling) {
            ctx.arc(0, -r * 0.15, r * 0.18, 0, Math.PI);
            ctx.fillStyle = '#f43f5e';
            ctx.fill();
            ctx.stroke();
        } else {
            ctx.arc(0, -r * 0.22, r * 0.1, 0.1, Math.PI - 0.1);
            ctx.stroke();
        }
    }

    isPointInside(px, py) {
        const dx = this.x - px;
        const dy = this.y - py;
        return Math.sqrt(dx * dx + dy * dy) <= this.radius;
    }
}

const BUBBLE_COLORS = [
    { bgLight: '#fde047', bgDark: '#eab308', textColor: '#713f12' },
    { bgLight: '#6ee7b7', bgDark: '#10b981', textColor: '#064e3b' },
    { bgLight: '#93c5fd', bgDark: '#3b82f6', textColor: '#1e3a8a' },
    { bgLight: '#f472b6', bgDark: '#ec4899', textColor: '#831843' },
    { bgLight: '#c084fc', bgDark: '#a855f7', textColor: '#581c87' }
];

// 游戏控制器
class GameApp {
    constructor() {
        this.canvas = document.getElementById('gameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.wrapper = document.getElementById('canvas-wrapper');

        this.audio = new AudioController();
        
        this.currentLevelIndex = 0;
        this.stars = 0;
        this.combo = 0;
        this.bubbles = [];
        this.particles = [];
        this.animFrameId = null;
        this.isGameStarted = false;

        this.initUI();
        this.bindEvents();
        this.resizeCanvas();
        this.loadLevel(this.currentLevelIndex);
        this.startLoop();
    }

    initUI() {
        this.levelDisplay = document.getElementById('level-display');
        this.starsDisplay = document.getElementById('stars-display');
        this.comboBadge = document.getElementById('combo-badge');
        this.targetWordDisplay = document.getElementById('target-word');
        this.feedbackOverlay = document.getElementById('feedback');
        this.feedbackIcon = document.getElementById('feedback-icon');
        this.feedbackText = document.getElementById('feedback-text');
        this.victoryModal = document.getElementById('victory-modal');
        this.settingsModal = document.getElementById('settings-modal');
        this.settingsCard = document.getElementById('settings-card');
        this.startModal = document.getElementById('start-modal');
        this.startGameBtn = document.getElementById('start-game-btn');
    }

    bindEvents() {
        window.addEventListener('resize', () => {
            this.resizeCanvas();
        });

        // 首次点击开始游戏引导（解锁 iOS / Android 移动端发音）
        this.startGameBtn.addEventListener('click', () => {
            this.audio.unlockAudio();
            this.startModal.classList.remove('active');
            this.isGameStarted = true;
            this.speakTargetPrompt();
        });

        const handleInteraction = (e) => {
            e.preventDefault();
            
            // 全局触摸触发解锁
            if (!this.audio.unlocked) {
                this.audio.unlockAudio();
            }

            const rect = this.canvas.getBoundingClientRect();
            let clickX, clickY;

            if (e.touches && e.touches.length > 0) {
                clickX = e.touches[0].clientX - rect.left;
                clickY = e.touches[0].clientY - rect.top;
            } else {
                clickX = e.clientX - rect.left;
                clickY = e.clientY - rect.top;
            }

            this.onCanvasClick(clickX, clickY);
        };

        this.canvas.addEventListener('mousedown', handleInteraction);
        this.canvas.addEventListener('touchstart', handleInteraction, { passive: false });

        // 朗读当前目标
        document.getElementById('read-target-btn').addEventListener('click', () => {
            if (this.currentTarget) {
                this.speakTargetPrompt();
            }
        });

        // 兼容多平台移动端全屏请求
        document.getElementById('fullscreen-toggle-btn').addEventListener('click', () => {
            const doc = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (doc.requestFullscreen) {
                    doc.requestFullscreen().catch(err => console.log(err));
                } else if (doc.webkitRequestFullscreen) {
                    doc.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        });

        // 设置面板触发
        document.getElementById('open-settings-btn').addEventListener('click', () => {
            this.syncSettingsToUI();
            this.settingsModal.classList.add('active');
        });

        const closeSettings = () => {
            this.settingsModal.classList.remove('active');
        };

        document.getElementById('close-settings-x').addEventListener('click', closeSettings);

        this.settingsModal.addEventListener('click', (e) => {
            if (e.target === this.settingsModal) {
                closeSettings();
            }
        });

        const setupOptionGroup = (groupId, settingKey) => {
            const container = document.getElementById(groupId);
            container.querySelectorAll('.option-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    container.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                });
            });
        };

        setupOptionGroup('age-options', 'age');
        setupOptionGroup('bank-options', 'bank');
        setupOptionGroup('mode-options', 'mode');
        setupOptionGroup('speed-options', 'speed');
        setupOptionGroup('avatar-options', 'avatar');

        // 保存设置并重新应用
        document.getElementById('save-settings-btn').addEventListener('click', () => {
            gameSettings.age = document.querySelector('#age-options .selected').dataset.value;
            gameSettings.bank = document.querySelector('#bank-options .selected').dataset.value;
            gameSettings.mode = document.querySelector('#mode-options .selected').dataset.value;
            gameSettings.speed = document.querySelector('#speed-options .selected').dataset.value;
            gameSettings.avatar = document.querySelector('#avatar-options .selected').dataset.value;

            this.settingsModal.classList.remove('active');
            this.loadLevel(this.currentLevelIndex);
        });

        // 下一关按钮
        document.getElementById('next-level-btn').addEventListener('click', () => {
            this.victoryModal.classList.remove('active');
            this.currentLevelIndex++;
            this.loadLevel(this.currentLevelIndex);
        });
    }

    speakTargetPrompt() {
        if (this.currentTarget) {
            this.audio.speak(`请找到：${this.currentTarget}`);
        }
    }

    syncSettingsToUI() {
        const updateGroupSelected = (groupId, val) => {
            const container = document.getElementById(groupId);
            container.querySelectorAll('.option-btn').forEach(btn => {
                if (btn.dataset.value === val) {
                    btn.classList.add('selected');
                } else {
                    btn.classList.remove('selected');
                }
            });
        };
        updateGroupSelected('age-options', gameSettings.age);
        updateGroupSelected('bank-options', gameSettings.bank);
        updateGroupSelected('mode-options', gameSettings.mode);
        updateGroupSelected('speed-options', gameSettings.speed);
        updateGroupSelected('avatar-options', gameSettings.avatar);
    }

    resizeCanvas() {
        this.width = this.wrapper.clientWidth;
        this.height = this.wrapper.clientHeight;
        
        const dpr = window.devicePixelRatio || 1;
        this.canvas.width = this.width * dpr;
        this.canvas.height = this.height * dpr;
        this.ctx.scale(dpr, dpr);
    }

    getWordPool() {
        let singleCharPool = [];
        let phrasePool = [];

        if (gameSettings.age === 'under5') {
            singleCharPool = [...UNDER_5_CHARACTERS];
            phrasePool = ["太阳", "月亮", "白云", "花草", "小鸟", "游鱼", "爸爸", "妈妈"];
        } else {
            if (gameSettings.bank === 'dizigui') {
                singleCharPool = [...DIZIGUI_CHARACTERS];
                phrasePool = [...DIZIGUI_PHRASES];
            } else if (gameSettings.bank === 'sanzijing') {
                singleCharPool = [...DIZIGUI_CHARACTERS, ...SANZIJING_CHARACTERS];
                phrasePool = [...DIZIGUI_PHRASES, ...SANZIJING_PHRASES];
            } else {
                singleCharPool = [...PRIMARY_GRADE2_CHARACTERS, ...DIZIGUI_CHARACTERS];
                phrasePool = [...PRIMARY_GRADE2_PHRASES, ...DIZIGUI_PHRASES];
            }
        }

        singleCharPool = Array.from(new Set(singleCharPool));
        phrasePool = Array.from(new Set(phrasePool));

        return { singleCharPool, phrasePool };
    }

    calculateMaxBubblesCap() {
        const area = this.width * this.height;
        let maxCap = Math.floor(area / 18000); 
        maxCap = Math.max(8, Math.min(maxCap, 20));

        if (gameSettings.age === 'under5') {
            maxCap = Math.max(6, Math.floor(maxCap * 0.75));
        }

        return maxCap;
    }

    loadLevel(levelIndex) {
        const levelNum = levelIndex + 1;
        this.levelDisplay.innerText = `关卡 ${levelNum}`;

        const { singleCharPool, phrasePool } = this.getWordPool();
        
        const maxCap = this.calculateMaxBubblesCap();
        const bubbleCount = Math.min(5 + Math.floor(levelIndex * 0.7), maxCap);

        let usePhrase = false;
        if (gameSettings.mode === 'phrase') {
            usePhrase = true;
        } else if (gameSettings.mode === 'single') {
            usePhrase = false;
        } else {
            usePhrase = (levelNum >= 3 && Math.random() > 0.4);
        }

        const activePool = (usePhrase && phrasePool.length > 0) ? phrasePool : singleCharPool;

        const targetIdx = Math.floor(Math.random() * activePool.length);
        this.currentTarget = activePool[targetIdx];
        this.targetWordDisplay.innerText = this.currentTarget;

        // 如果用户已经点击开始过游戏，载入新关卡时立刻朗读
        if (this.isGameStarted) {
            setTimeout(() => {
                this.speakTargetPrompt();
            }, 300);
        }

        const allTexts = [this.currentTarget];
        const distractorsPool = activePool.filter(item => item !== this.currentTarget);
        
        while (allTexts.length < bubbleCount && distractorsPool.length > 0) {
            const rIdx = Math.floor(Math.random() * distractorsPool.length);
            allTexts.push(distractorsPool.splice(rIdx, 1)[0]);
        }

        allTexts.sort(() => Math.random() - 0.5);

        const area = this.width * this.height;
        let baseRadius = Math.sqrt(area / (bubbleCount * 4.2));
        baseRadius = Math.max(32, Math.min(baseRadius, 58));

        const speedMultiplier = SPEED_MULTIPLIERS[gameSettings.speed] || 2.8;

        this.bubbles = [];
        this.particles = [];
        for (let i = 0; i < allTexts.length; i++) {
            const text = allTexts[i];
            const isTarget = (text === this.currentTarget);
            const colorScheme = BUBBLE_COLORS[i % BUBBLE_COLORS.length];
            const animalType = ANIMAL_TYPES[i % ANIMAL_TYPES.length];

            let x, y, overlapping;
            let attempts = 0;

            do {
                overlapping = false;
                x = baseRadius + Math.random() * (this.width - baseRadius * 2);
                y = baseRadius + Math.random() * (this.height - baseRadius * 2);

                for (let b of this.bubbles) {
                    const dist = Math.hypot(b.x - x, b.y - y);
                    if (dist < baseRadius * 2 + 8) {
                        overlapping = true;
                        break;
                    }
                }
                attempts++;
            } while (overlapping && attempts < 80);

            this.bubbles.push(new Bubble(x, y, baseRadius, text, isTarget, colorScheme, speedMultiplier, animalType));
        }
    }

    onCanvasClick(px, py) {
        for (let i = this.bubbles.length - 1; i >= 0; i--) {
            const bubble = this.bubbles[i];
            if (bubble.isPointInside(px, py)) {
                bubble.scale = 0.8;
                bubble.targetScale = 1;
                bubble.smileTimer = 40;

                if (bubble.isTarget) {
                    this.audio.playSFX('correct');
                    this.audio.speak(bubble.text, 0.85, () => {
                        if (Math.random() > 0.4) {
                            const praise = PRAISE_WORDS[Math.floor(Math.random() * PRAISE_WORDS.length)];
                            this.audio.speak(praise, 1.0);
                        } else {
                            this.audio.playSFX('cheer');
                        }
                    });
                    this.handleCorrectSelection(bubble);
                } else {
                    this.audio.speak(bubble.text);
                    this.handleWrongSelection();
                }
                break;
            }
        }
    }

    spawnConfetti(x, y) {
        for (let i = 0; i < 40; i++) {
            this.particles.push(new Particle(x, y));
        }
    }

    handleCorrectSelection(bubble) {
        this.combo++;
        const extraBonus = (this.combo > 1) ? this.combo * 5 : 0;
        this.stars += (10 + extraBonus);
        this.starsDisplay.innerText = this.stars;

        this.spawnConfetti(bubble.x, bubble.y);

        if (this.combo > 1) {
            this.comboBadge.innerText = `🔥 Combo x${this.combo}`;
            this.comboBadge.classList.add('active');
        }

        const praiseText = this.combo > 1 ? `太棒啦! x${this.combo}` : '回答正确！';
        this.showFeedback('🎉', praiseText, '#10b981');

        this.bubbles = this.bubbles.filter(b => b !== bubble);

        const remainingTargets = this.bubbles.filter(b => b.isTarget);
        if (remainingTargets.length === 0) {
            setTimeout(() => {
                this.audio.playSFX('levelUp');
                this.showVictoryModal();
            }, 1800);
        }
    }

    handleWrongSelection() {
        this.combo = 0;
        this.comboBadge.classList.remove('active');

        this.audio.playSFX('wrong');
        this.showFeedback('❌', '点错啦', '#ef4444');
    }

    showFeedback(icon, text, color) {
        this.feedbackIcon.innerText = icon;
        this.feedbackText.innerText = text;
        this.feedbackText.style.color = color;
        this.feedbackOverlay.classList.add('show');

        setTimeout(() => {
            this.feedbackOverlay.classList.remove('show');
        }, 750);
    }

    showVictoryModal() {
        document.getElementById('modal-title-text').innerText = `顺利通过 关卡 ${this.currentLevelIndex + 1}！`;
        document.getElementById('modal-desc-text').innerText = `太棒了！你学会了“${this.currentTarget}”！`;
        this.victoryModal.classList.add('active');
    }

    handleCollisions() {
        for (let i = 0; i < this.bubbles.length; i++) {
            for (let j = i + 1; j < this.bubbles.length; j++) {
                const b1 = this.bubbles[i];
                const b2 = this.bubbles[j];

                const dx = b2.x - b1.x;
                const dy = b2.y - b1.y;
                const distance = Math.hypot(dx, dy);
                const minDist = b1.radius + b2.radius;

                if (distance < minDist) {
                    const overlap = minDist - distance;
                    const nx = dx / (distance || 1);
                    const ny = dy / (distance || 1);

                    b1.x -= nx * overlap * 0.5;
                    b1.y -= ny * overlap * 0.5;
                    b2.x += nx * overlap * 0.5;
                    b2.y += ny * overlap * 0.5;

                    const kx = b1.vx - b2.vx;
                    const ky = b1.vy - b2.vy;
                    const p = 2 * (nx * kx + ny * ky) / (b1.mass + b2.mass);

                    b1.vx -= p * b2.mass * nx;
                    b1.vy -= p * b2.mass * ny;
                    b2.vx += p * b1.mass * nx;
                    b2.vy += p * b1.mass * ny;
                }
            }
        }
    }

    startLoop() {
        const render = () => {
            this.ctx.clearRect(0, 0, this.width, this.height);

            this.handleCollisions();

            for (let bubble of this.bubbles) {
                bubble.update(this.width, this.height);
                bubble.draw(this.ctx);
            }

            for (let i = this.particles.length - 1; i >= 0; i--) {
                const p = this.particles[i];
                p.update();
                p.draw(this.ctx);
                if (p.alpha <= 0) {
                    this.particles.splice(i, 1);
                }
            }

            this.animFrameId = requestAnimationFrame(render);
        };
        render();
    }
}

window.onload = () => {
    new GameApp();
};
</script>
